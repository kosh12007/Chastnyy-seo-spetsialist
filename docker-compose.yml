version: '3.8'

services:
  # React Dev сервер
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-site-dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev
    restart: unless-stopped

  # Nginx (прокси для dev)
  nginx:
    image: nginx:1.25-alpine
    container_name: seo-nginx-dev
    ports:
      - '8085:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

networks:
  default:
    name: seo-site-dev-network

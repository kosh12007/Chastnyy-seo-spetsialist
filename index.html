<!doctype html>
<html lang="ru" class="scroll-smooth">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="description" content="Системное SEO-продвижение сайтов в Яндекс и Google от частного эксперта (самозанятый). Прозрачные KPI, белые методы, договор и чеки." />
    <!-- Инлайн-инициализация темы оформления без мерцания (FOUC) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('seo_theme');
          var theme = saved || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Google Fonts: Plus Jakarta Sans для заголовков и текста, JetBrains Mono для данных -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!doctype html>
<html lang="ru" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Системное SEO-продвижение сайтов в Яндекс и Google от частного эксперта (самозанятый). Прозрачные KPI, белые методы, договор и чеки." />
    <!-- Инлайн-инициализация темы оформления без мерцания (FOUC) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('seo_theme');
          var theme = saved || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Локальные шрифты: Plus Jakarta Sans и JetBrains Mono (без обращения к внешним CDN) -->
    <link rel="stylesheet" href="/fonts/fonts.css">
    <title>Михаил Павлов — Частный SEO-специалист | Системное продвижение сайтов</title>
    <!-- Подключение Яндекс.Метрики в самом верху дерева для максимального сбора аналитики -->
    <script src="/yandex-metrika.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-obsidian-950 dark:text-slate-100 antialiased selection:bg-growth-500/20 selection:text-growth-600 dark:selection:text-growth-300 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

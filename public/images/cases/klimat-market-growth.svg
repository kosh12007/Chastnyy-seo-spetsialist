<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background-color: #070A0F; border-radius: 16px; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <!-- Градиент заливки под кривой органического трафика -->
    <linearGradient id="trafficGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#10B981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <!-- Свечение акцентных линий -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фоновая координатная сетка -->
  <g stroke="#141C2B" stroke-width="1" stroke-dasharray="4 4">
    <line x1="80" y1="95" x2="940" y2="95" />
    <line x1="80" y1="160" x2="940" y2="160" />
    <line x1="80" y1="225" x2="940" y2="225" />
    <line x1="80" y1="290" x2="940" y2="290" />
    <line x1="80" y1="355" x2="940" y2="355" />
  </g>

  <!-- Базовая линия X -->
  <line x1="80" y1="410" x2="940" y2="410" stroke="#1E293B" stroke-width="1.5" />

  <!-- Шапка графика / Заголовок -->
  <g transform="translate(80, 42)">
    <rect x="0" y="-10" width="10" height="10" rx="3" fill="#10B981" />
    <text x="20" y="0" fill="#F8FAFC" font-size="15" font-weight="700" letter-spacing="-0.01em">
      Динамика поискового трафика и позиций
    </text>
    <text x="20" y="20" fill="#64748B" font-size="11" font-family="'JetBrains Mono', monospace">
      Старт с нулевой видимости • Яндекс и Google • Данные веб-аналитики
    </text>
  </g>

  <!-- Плашки показателей справа -->
  <g transform="translate(670, 32)">
    <!-- Трафик -->
    <rect x="0" y="0" width="125" height="38" rx="8" fill="#0B131F" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="12" y="15" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace">ТРАФИК / МЕСЯЦ</text>
    <text x="12" y="30" fill="#10B981" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">5 120 визитов</text>

    <!-- ТОП-10 -->
    <rect x="135" y="0" width="135" height="38" rx="8" fill="#0B131F" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
    <text x="145" y="15" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace">ДОЛЯ В ТОП-10</text>
    <text x="145" y="30" fill="#F59E0B" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">42% (ТОП-3: 31%)</text>
  </g>

  <!-- Шкала оси Y (Уникальные посетители в месяц) -->
  <g fill="#64748B" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="end">
    <text x="68" y="99">5 500</text>
    <text x="68" y="164">4 000</text>
    <text x="68" y="229">3 000</text>
    <text x="68" y="294">2 000</text>
    <text x="68" y="359">1 000</text>
    <text x="68" y="414">0</text>
  </g>

  <!-- Заливка под графиком органического трафика
       М1: (110, 362)  [940]
       М2: (230, 342)  [1 380]
       М3: (350, 310)  [1 950]
       М4: (470, 245)  [2 820]
       М5: (590, 180)  [3 760]
       М6: (710, 138)  [4 450]
       М7: (830, 108)  [5 120]
       Пик: (910, 96)  [5 450]
  -->
  <path d="M 110 410 
           L 110 362 
           C 170 355, 190 348, 230 342 
           C 290 332, 310 320, 350 310 
           C 410 280, 430 260, 470 245 
           C 530 215, 550 195, 590 180 
           C 650 160, 670 148, 710 138 
           C 770 124, 790 114, 830 108 
           C 870 102, 890 98, 910 96 
           L 910 410 Z" 
        fill="url(#trafficGlow)" />

  <!-- Пунктирная кривая видимости ТОП-10 (Янтарная) -->
  <path d="M 110 400 
           C 170 395, 190 388, 230 382 
           C 290 365, 310 340, 350 325 
           C 410 290, 430 250, 470 215 
           C 530 180, 550 160, 590 145 
           C 650 135, 670 128, 710 122 
           C 770 118, 790 114, 830 110 
           C 870 108, 890 106, 910 104" 
        fill="none" 
        stroke="#F59E0B" 
        stroke-width="2" 
        stroke-dasharray="4 4" 
        opacity="0.85" />

  <!-- Основная линия трафика (Изумрудная) -->
  <path d="M 110 362 
           C 170 355, 190 348, 230 342 
           C 290 332, 310 320, 350 310 
           C 410 280, 430 260, 470 245 
           C 530 215, 550 195, 590 180 
           C 650 160, 670 148, 710 138 
           C 770 124, 790 114, 830 108 
           C 870 102, 890 98, 910 96" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="3" 
        filter="url(#neonFilter)" />

  <!-- Точки замеров -->
  <g fill="#070A0F" stroke="#10B981" stroke-width="2">
    <circle cx="110" cy="362" r="4.5" />
    <circle cx="230" cy="342" r="4.5" />
    <circle cx="350" cy="310" r="4.5" />
    <circle cx="470" cy="245" r="4.5" />
    <circle cx="590" cy="180" r="4.5" />
    <circle cx="710" cy="138" r="4.5" />
    <circle cx="830" cy="108" r="4.5" />
    <circle cx="910" cy="96" r="6" fill="#10B981" />
  </g>

  <!-- Числовые метки над графиком -->
  <g fill="#F8FAFC" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="middle">
    <text x="110" y="348">940</text>
    <text x="230" y="328">1 380</text>
    <text x="350" y="295">1 950</text>
    <text x="470" y="230">2 820</text>
    <text x="590" y="165">3 760</text>
    <text x="710" y="122">4 450</text>
    <text x="830" y="92">5 120</text>
    <text x="910" y="80" fill="#34D399" font-size="12">5 450 (пик)</text>
  </g>

  <!-- Подписи этапов по оси X -->
  <g fill="#94A3B8" font-size="10.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">
    <text x="110" y="432">Старт</text>
    <text x="230" y="432">Этап 1</text>
    <text x="350" y="432">Этап 2</text>
    <text x="470" y="432">Этап 3</text>
    <text x="590" y="432">Этап 4</text>
    <text x="710" y="432">Этап 5</text>
    <text x="830" y="432">Этап 6</text>
    <text x="910" y="432">Сезон</text>

    <!-- Пояснения ключевых этапов -->
    <text x="110" y="450" fill="#64748B" font-size="9.5">Технический аудит и правки</text>
    <text x="230" y="450" fill="#64748B" font-size="9.5">Ядро 5800 фраз</text>
    <text x="350" y="450" fill="#64748B" font-size="9.5">Шаблоны Meta</text>
    <text x="470" y="450" fill="#64748B" font-size="9.5">Рост страниц в ТОП</text>
    <text x="590" y="450" fill="#64748B" font-size="9.5">Статьи в блог</text>
    <text x="710" y="450" fill="#64748B" font-size="9.5">UX калькулятор</text>
    <text x="830" y="450" fill="#10B981" font-size="9.5" font-weight="600">ТОП-10: 42%</text>
    <text x="910" y="450" fill="#10B981" font-size="9.5" font-weight="600">Пик спроса</text>
  </g>

  <!-- Легенда внизу -->
  <g transform="translate(80, 490)">
    <line x1="0" y1="5" x2="22" y2="5" stroke="#10B981" stroke-width="3" />
    <circle cx="11" cy="5" r="3" fill="#10B981" />
    <text x="30" y="9" fill="#94A3B8" font-size="11">Органический трафик (визиты/мес)</text>

    <line x1="260" y1="5" x2="282" y2="5" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" />
    <text x="290" y="9" fill="#94A3B8" font-size="11">Доля ключевых запросов в ТОП-10 (%)</text>
  </g>
</svg>
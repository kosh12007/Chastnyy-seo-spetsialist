<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background-color: #070A0F; border-radius: 16px; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <!-- Градиент заливки органического трафика -->
    <linearGradient id="mediaGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <!-- Свечение линий -->
    <filter id="mediaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Сетка графика -->
  <g stroke="#141C2B" stroke-width="1" stroke-dasharray="4 4">
    <line x1="80" y1="90" x2="940" y2="90" />
    <line x1="80" y1="165" x2="940" y2="165" />
    <line x1="80" y1="240" x2="940" y2="240" />
    <line x1="80" y1="315" x2="940" y2="315" />
  </g>

  <!-- Базовая линия X -->
  <line x1="80" y1="390" x2="940" y2="390" stroke="#1E293B" stroke-width="1.5" />

  <!-- Заголовок графика -->
  <g transform="translate(80, 42)">
    <rect x="0" y="-10" width="10" height="10" rx="3" fill="#10B981" />
    <text x="20" y="0" fill="#F8FAFC" font-size="15" font-weight="700" letter-spacing="-0.01em">
      Рост поискового трафика медиапортала (Яндекс и Google)
    </text>
    <text x="20" y="20" fill="#64748B" font-size="11" font-family="'JetBrains Mono', monospace">
      Исключительно SEO-трафик с июня по октябрь 2026 • Без учета соцсетей и прямого пула
    </text>
  </g>

  <!-- Плашки ключевых метрик справа -->
  <g transform="translate(640, 32)">
    <rect x="0" y="0" width="115" height="38" rx="8" fill="#0B131F" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="12" y="15" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace">ПОИСКОВЫЙ ТРАФИК</text>
    <text x="12" y="30" fill="#10B981" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">+1 285% (х14)</text>

    <rect x="155" y="0" width="155" height="38" rx="8" fill="#0B131F" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
    <text x="167" y="15" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace">ОТКАЗЫ ИЗ ПОИСКА</text>
    <text x="167" y="30" fill="#F59E0B" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">2.4% (Я) / 3.3% (G)</text>
  </g>

  <!-- Значения шкалы Y (Визиты / месяц) -->
  <g fill="#64748B" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="end">
    <text x="68" y="94">2 000</text>
    <text x="68" y="169">1 500</text>
    <text x="68" y="244">1 000</text>
    <text x="68" y="319">500</text>
    <text x="68" y="394">0</text>
  </g>

  <!-- Заливка под графиком органического трафика
       Июнь: (120, 370) [133 визита]
       Июль: (310, 381) [57 визитов]
       Август: (500, 249) [941 визит]
       Сентябрь: (690, 133) [1 715 визитов]
       Октябрь: (880, 114) [1 843 визита]
  -->
  <path d="M 120 390 
           L 120 370 
           C 180 370, 250 380, 310 381 
           C 370 382, 440 290, 500 249 
           C 560 208, 630 150, 690 133 
           C 750 120, 820 115, 880 114 
           L 880 390 Z" 
        fill="url(#mediaGradient)" />

  <!-- Линия органического трафика (Изумрудная с подсветкой) -->
  <path d="M 120 370 
           C 180 370, 250 380, 310 381 
           C 370 382, 440 290, 500 249 
           C 560 208, 630 150, 690 133 
           C 750 120, 820 115, 880 114" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="3.5" 
        filter="url(#mediaGlow)" />

  <!-- Точки на графике -->
  <g fill="#070A0F" stroke="#10B981" stroke-width="2.5">
    <circle cx="120" cy="370" r="4.5" />
    <circle cx="310" cy="381" r="4.5" />
    <circle cx="500" cy="249" r="5" />
    <circle cx="690" cy="133" r="5" />
    <circle cx="880" cy="114" r="6" fill="#10B981" />
  </g>

  <!-- Цифры над точками -->
  <g fill="#F8FAFC" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="middle">
    <text x="120" y="354">133 (старт)</text>
    <text x="310" y="367">57 визитов</text>
    <text x="500" y="233">941 визит</text>
    <text x="690" y="117">1 715 визитов</text>
    <text x="880" y="96" fill="#34D399" font-size="13">1 843 визита (+1 285%)</text>
  </g>

  <!-- Подписи этапов по оси X -->
  <g fill="#94A3B8" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">
    <text x="120" y="415">Июнь</text>
    <text x="310" y="415">Июль</text>
    <text x="500" y="415">Август</text>
    <text x="690" y="415">Сентябрь</text>
    <text x="880" y="415">Октябрь</text>

    <!-- Пояснения реальных этапов SEO -->
    <text x="120" y="438" fill="#64748B" font-size="10">Старт и аудит</text>
    <text x="310" y="438" fill="#64748B" font-size="10">Склейка зеркал и редиректы</text>
    <text x="500" y="438" fill="#64748B" font-size="10">Первая перелинковка рубрик</text>
    <text x="690" y="438" fill="#64748B" font-size="10">Внешние ссылки и рост</text>
    <text x="880" y="438" fill="#10B981" font-size="10" font-weight="600">Канал №1 (58% трафика)</text>
  </g>

  <!-- Легенда внизу -->
  <g transform="translate(80, 485)">
    <line x1="0" y1="5" x2="22" y2="5" stroke="#10B981" stroke-width="3" />
    <circle cx="11" cy="5" r="3" fill="#10B981" />
    <text x="30" y="9" fill="#94A3B8" font-size="11">Органический трафик из поиска (визиты / месяц)</text>

    <rect x="360" y="0" width="10" height="10" rx="2" fill="#F59E0B" />
    <text x="378" y="9" fill="#94A3B8" font-size="11">Показатель отказов: 2.4% (Яндекс) и 3.3% (Google)</text>
  </g>
</svg>
